name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-and-a11y:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: estrena
          POSTGRES_PASSWORD: estrena
          POSTGRES_DB: estrena_cultura
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run backend migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://estrena:estrena@localhost:5432/estrena_cultura
        run: npx tsx src/migrate.ts

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://estrena:estrena@localhost:5432/estrena_cultura
          PORT: 4000
        run: npm run dev &

      - name: Run Playwright + axe-core tests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: estrena
      POSTGRES_USER: estrena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estrena_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estrena -d estrena"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.26
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://estrena:${POSTGRES_PASSWORD:-estrena_dev}@postgres:5432/estrena
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@estrenacultura.local
      APP_BASE_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      CODE_PEPPER: ${CODE_PEPPER:-dev-only-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
